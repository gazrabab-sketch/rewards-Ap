name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── FIX: libunwind-dev conflict حل تعارض ─────────────────────────────
      # نثبّت libunwind-dev أولاً بشكل منفصل قبل أي شيء آخر
      # ثم نستبعد gstreamer كلياً — Kivy/Android لا يحتاجه وقت البناء
      - name: Fix libunwind conflict & install system deps
        run: |
          sudo apt-get update -y

          # ثبّت libunwind أولاً بمفرده لتجنّب التعارض
          sudo apt-get install -y --no-install-recommends libunwind-dev

          # باقي الـ deps بدون أي حزمة gstreamer
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            cmake ninja-build \
            autoconf libtool pkg-config \
            libffi-dev libssl-dev \
            zlib1g-dev libltdl-dev \
            libbz2-dev libreadline-dev \
            libsqlite3-dev libncursesw5-dev \
            libgdbm-dev liblzma-dev uuid-dev \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            ffmpeg libavcodec-dev \
            libavformat-dev libswscale-dev

      # ── Cython مثبَّت على 0.29.36 — لا ترفعه (pyjnius يكسر مع 3.x) ──────
      - name: Install Python build tools
        run: |
          pip install --upgrade pip wheel setuptools
          pip install "Cython==0.29.36"
          pip install "buildozer==1.5.0"

      - name: Cache buildozer & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-bz-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-bz-

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license"

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name:           football-quiz-${{ github.sha }}
          path:           bin/*.apk
          retention-days: 7
